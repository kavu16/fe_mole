[package]
name = "fe_mole"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "A molecular dynamics engine written from scratch in Rust"

[lib]
name = "fe_mole"
path = "src/lib.rs"

[[bin]]
name = "fe_mole"
path = "src/main.rs"

[dependencies]
itertools = "0.15.0"
# Seedable, reproducible RNG streams. Required from M1 (Maxwell-Boltzmann
# velocity initialisation) and central to M3's stochastic integrators, which
# are untestable without reproducibility.
rand = "0.10.2"
rand_distr = "0.6.0"
rand_pcg = "0.10.2"
# Still to come: rustfft at M4 (PME), rayon at M5.

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "minimum_image"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
# Keep symbols in release builds so `samply`/`perf` can attribute time to source
# lines during the M5 profiling work. Costs binary size, not speed.
debug = 1

[lints.rust]
missing_docs = "warn"
